<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hunger Games em Berlim</title>
<style>
:root{
  --bg:#0f0f11; --panel:#18181c; --panel2:#202025; --line:#2f2f36;
  --text:#efede6; --mute:#a3a097; --gold:#d6a93c; --gold-d:#8e7022; --red:#c8282f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:clamp(11px,1.9vh,15px);line-height:1.42;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#app{height:100vh;min-height:480px;display:flex;flex-direction:column;padding:clamp(8px,1.8vh,14px) 18px clamp(6px,1.5vh,12px);gap:clamp(6px,1.4vh,10px)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:1.333em;letter-spacing:.02em;font-weight:700}
.brand h1 span{color:var(--gold)}
.brand p{color:var(--mute);font-size:0.833em;margin-top:1px}
.tabs{display:flex;gap:4px;background:var(--panel);padding:3px;border-radius:9px;border:1px solid var(--line)}
.tab{padding:7px 14px;border-radius:7px;font-weight:600;font-size:0.900em;color:var(--mute)}
.tab[aria-selected="true"]{background:var(--gold);color:#1a1405}

/* stop pills */
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{min-width:34px;height:34px;padding:0 10px;border-radius:17px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:0.900em;color:var(--mute);display:inline-flex;align-items:center;justify-content:center}
.pill:hover{border-color:var(--gold-d);color:var(--text)}
.pill[aria-current="true"]{background:var(--gold);border-color:var(--gold);color:#1a1405}

/* stage */
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px}
.photos{display:flex;flex-direction:column;gap:10px;min-height:0}
.fig{position:relative;border-radius:10px;overflow:hidden;background:var(--panel);border:1px solid var(--line);flex:1;min-height:0}
.fig img{width:100%;height:100%;object-fit:cover;display:block}
.fig.scene{flex:.62}
.cap{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 6px;font-size:0.733em;color:#e8e6df;background:linear-gradient(transparent,rgba(0,0,0,.78))}
.badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.72);border:1px solid var(--gold-d);color:var(--gold);font-size:0.733em;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:5px;text-transform:uppercase}
.sw{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.sw button{width:26px;height:22px;border-radius:5px;background:rgba(0,0,0,.72);border:1px solid var(--line);font-size:0.800em;font-weight:700}
.sw button[aria-pressed="true"]{background:var(--gold);color:#1a1405;border-color:var(--gold)}

.info{display:flex;flex-direction:column;gap:clamp(6px,1.3vh,10px);min-height:0}
.head .films{font-size:0.767em;letter-spacing:.07em;text-transform:uppercase;color:var(--gold);font-weight:700}
.head h2{font-size:1.733em;line-height:1.15;margin-top:2px}
.head .area{color:var(--mute);font-size:0.867em;margin-top:2px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:clamp(6px,1.2vh,10px) 13px}
.box h3{font-size:0.767em;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:5px;font-weight:700}
.box p{font-size:0.933em}
.facts{list-style:none;display:flex;flex-direction:column;gap:6px}
.facts li{position:relative;padding-left:15px;font-size:0.933em}
.facts li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
.curio{border-color:var(--gold-d);background:#1d1a10}
.curio h3{color:var(--gold)}
.reelbox{border-left:3px solid var(--red)}
.reelbox .t{font-size:0.767em;color:var(--mute);font-weight:700;margin-bottom:3px}
.reelbox p{font-size:0.933em;font-style:italic}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.btn{padding:9px 14px;border-radius:8px;font-weight:700;font-size:0.900em;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--gold-d)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1a1405}
.btn.primary:hover{filter:brightness(1.07)}
.nav{display:flex;gap:6px;margin-left:auto}

.subtabs{display:none}

/* reels */
.reels{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.rsum{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;color:var(--mute);font-size:0.867em}
.rsum b{color:var(--text);font-size:1.067em}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:1fr;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:clamp(6px,1.2vh,10px) 12px;display:flex;flex-direction:column;gap:5px;min-height:0;overflow:hidden}
.card .time{font-size:0.800em;font-weight:800;color:#1a1405;background:var(--gold);align-self:flex-start;padding:1px 8px;border-radius:5px}
.card h4{font-size:0.933em;line-height:1.2}
.card .say{font-size:0.900em;font-weight:600}
.card .shot{font-size:0.800em;color:var(--mute)}
.card .txt{font-size:0.767em;color:var(--gold);font-weight:700;margin-top:auto;letter-spacing:.04em;text-transform:uppercase}
.rnav{display:none}

.foot{font-size:0.733em;color:#77756e}

/* mobile: tabs and steppers instead of scroll */
@media (max-width:760px){
  #app{padding:10px 12px 10px;gap:8px}
  .brand h1{font-size:1.133em}
  .brand p{display:none}
  .tab{padding:6px 10px;font-size:0.867em}
  .pill{min-width:30px;height:30px;font-size:0.833em;padding:0 6px}
  .stage{grid-template-columns:1fr;gap:8px;align-content:start;grid-auto-rows:auto}
  .subtabs{display:flex;gap:4px}
  .subtabs button{flex:1;padding:7px 4px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:0.867em;font-weight:600;color:var(--mute)}
  .subtabs button[aria-selected="true"]{background:var(--panel2);color:var(--gold);border-color:var(--gold-d)}
  .photos,.info .box{display:none}
  .stage[data-sub="fotos"] .photos{display:flex}
  .stage[data-sub="cena"] .box[data-g="cena"],
  .stage[data-sub="fatos"] .box[data-g="fatos"],
  .stage[data-sub="acesso"] .box[data-g="acesso"]{display:block}
  .head h2{font-size:1.400em}
  .nav{margin-left:0}
  .actions{gap:6px}
  .btn{padding:8px 10px;font-size:0.867em}
  .grid{display:block;position:relative}
  .card{display:none;height:100%}
  .card.on{display:flex}
  .rnav{display:flex;gap:8px;justify-content:space-between;align-items:center}
}
@media (max-width:760px) and (min-height:0){
  .box p,.facts li{font-size:0.900em}
}

.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:.45em;background:#666}
.dot.ok{background:#4caf7a}.dot.mid{background:var(--gold)}.dot.no{background:var(--red)}
.acc{display:flex;gap:8px;align-items:flex-start;font-size:.93em}
.acc+.acc{margin-top:6px}
.acc b{color:var(--text)}
.acesso{border-left:3px solid var(--gold-d)}
.pill.wide{padding:0 12px;font-size:.82em}
.rstage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:18px;align-content:start}
.rcol{display:flex;flex-direction:column;gap:clamp(6px,1.3vh,10px);min-height:0}
.time{font-size:.8em;font-weight:800;color:#1a1405;background:var(--gold);align-self:flex-start;padding:1px 8px;border-radius:5px}
.rcol h2{font-size:1.6em;line-height:1.15}
.say p{font-size:1.1em;font-weight:600}
.shot p,.tx p{font-size:.95em}
.tx p{color:var(--gold);font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.xgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-content:start}
.hint{color:var(--mute);font-size:.9em}
@media (max-width:760px){
  .rstage{grid-template-columns:1fr;gap:8px}
  .rcol .box{display:none}
  .rcol h2,.rcol .time{display:none}
  .rstage[data-rsub="fala"] .box[data-rg="fala"],
  .rstage[data-rsub="mais"] .box[data-rg="mais"],
  .rstage[data-rsub="planos"] .box[data-rg="planos"]{display:block}
  .rstage[data-rsub="fala"] .rcol h2,.rstage[data-rsub="fala"] .rcol .time{display:block}
  .xgrid{grid-template-columns:1fr}
}

.only-m{display:none}
.rsel{width:100%;padding:8px 10px;border-radius:8px;background:var(--panel);color:var(--text);border:1px solid var(--line);font:inherit}
.xwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
@media (max-width:760px){
  .only-m{display:block}
  .hide-m{display:none}
  .xwrap .xgrid .box{display:none}
  .xwrap[data-esub="ganchos"] .box[data-e="ganchos"],
  .xwrap[data-esub="fechos"] .box[data-e="fechos"],
  .xwrap[data-esub="legenda"] .box[data-e="legenda"],
  .xwrap[data-esub="dicas"] .box[data-e="dicas"]{display:block}
  .xwrap .xgrid{display:block}
  .rstage .rcol .box,.rstage .rcol .facts li{font-size:.97em}
}
</style>
</head>

const REELS=[{"a": "0:00", "b": "0:06", "t": "Gancho", "chip": "Gancho", "say": "Estou em Berlim seguindo o Hunger Games: 9 cenários reais num dia só. Começa agora.", "shot": "Rod no Ostbahnhof, mapa aberto no celular.", "txt": "HUNGER GAMES EM BERLIM", "mais": ["Muita gente não sabe, mas boa parte da Capital de Hunger Games foi filmada aqui em Berlim.", "Saí do Ostbahnhof com uma lista de 9 lugares e uma regra: só por fora, sem pagar ingresso.", "Três filmes passaram por aqui: Mockingjay Parte 2, A Cantiga dos Pássaros e das Serpentes e Amanhecer na Colheita.", "Vou comparar a cena do filme com o lugar de verdade, bem no mesmo ângulo.", "Spoiler: metade da Capital é só concreto e arquitetura de Berlim mesmo."], "planos": ["Placa do Ostbahnhof e Rod saindo da estação.", "Tela do celular com os 11 pins no mapa.", "Rod andando de frente pra câmera, falando rápido.", "Comparação rápida: um frame do filme e depois o lugar real."], "pergunta": "Qual desses lugares você reconhece de primeira?"}, {"a": "0:06", "b": "0:14", "t": "Olympiastadion", "chip": "Olympiastadion", "say": "Aqui é a arena dos Jogos. O estádio das Olimpíadas de 1936 virou o palco da Capital.", "shot": "Plano aberto da fachada. Corte comparando com a cena.", "txt": "Olympiastadion", "mais": ["Esse estádio foi construído em 1934–36 pelo arquiteto Werner March, pras Olimpíadas de 1936.", "No filme, ele aparece como a arena dos Jogos: é aqui que os tributos entram, com um pouco de CGI na fachada.", "Em Amanhecer na Colheita, o desfile dos tributos acontece lá dentro, com fumaça roxa e amarela.", "Hoje cabem uns 74 mil torcedores e foi aqui que rolou a final da Euro 2024.", "Em 2009, o Usain Bolt fez 9,58 nos 100 metros nesse estádio.", "O March queria deixar o concreto à mostra, mas teve que revestir de pedra. É essa pedra que a gente vê."], "planos": ["Plano aberto das duas torres da entrada.", "Close na fachada de pedra.", "Rod andando pela praça, câmera atrás.", "Segura o celular com o frame do filme na frente do estádio real."], "pergunta": "Você sabia que a arena do Hunger Games é um estádio de verdade?"}, {"a": "0:14", "b": "0:26", "t": "Messedamm: ICC, Passerelle e Messe", "chip": "Messedamm", "say": "O ICC, fechado desde 2014, foi a Capital. A passagem laranja embaixo do Messedamm é do Mockingjay. A entrada da Messe virou a estação de trem.", "shot": "Três planos rápidos: prédio, passagem e entrada.", "txt": "ICC · PASSERELLE · MESSE", "mais": ["Isso aqui é o ICC. Parece uma nave espacial, né? Foi inaugurado em 1979.", "Custou quase um bilhão de marcos, a obra mais cara da Berlim Ocidental no pós-guerra.", "Fechou em 2014 por causa de amianto e até hoje não dá pra entrar. Só abriu rapidinho em 2021 para um projeto de arte.", "No filme, o exterior é a Capital quase sem retoque. Por dentro foram filmados os apartamentos dos tributos e as salas de treino.", "Logo do lado fica a Passerelle, uma passagem subterrânea sob o Messedamm, com azulejos laranja. Aqui rolou a cena do Peeta e da Katniss no Mockingjay 2.", "A entrada sul da Messe virou a Capitol Main Station, a estação de trem da Capital. É bem mais nova que o resto, do início dos anos 2000.", "Do lado fica a Funkturm, a torre de rádio de 1926, e mais de 17 milhões de pessoas já subiram na plataforma."], "planos": ["Panorâmica lenta do ICC de um lado ao outro.", "Plano baixo olhando pra cima, a fachada gigante.", "Rod andando pelo corredor da passagem laranja.", "Fachada redonda da entrada sul e a placa MESSE BERLIN.", "A Funkturm aparecendo no fundo."], "pergunta": "Esse prédio devia ser reaberto ou continuar fechado?"}, {"a": "0:26", "b": "0:36", "t": "Tempelhof", "chip": "Tempelhof", "say": "Antigo aeroporto, o maior monumento da Europa. No Mockingjay 2, o letreiro virou DISTRICT TWO.", "shot": "Plano largo do prédio, caminhando pelo campo.", "txt": "TEMPELHOF = DISTRITO 2", "mais": ["O terminal foi construído entre 1936 e 1941 pelo arquiteto Ernst Sagebiel.", "É considerado o maior monumento arquitetônico da Europa.", "Em 1909 o Orville Wright fez demonstração de voo aqui, e em 1948 o aeroporto virou símbolo da Ponte Aérea de Berlim.", "Fechou em 2008 e virou parque. Hoje as pessoas fazem piquenique, andam de patins e bicicleta na pista de pouso.", "Em 2014, os berlinenses votaram em referendo para que nada seja construído no campo.", "Pro Mockingjay Parte 2, teve batalha em grande escala nos pátios e o Hangar 2 virou acampamento rebelde.", "O letreiro histórico do terminal foi trocado por DISTRICT TWO durante a gravação.", "Dizem que limparam só um trecho da fachada pra parecer nova e esqueceram do resto, mas isso é relato de blog."], "planos": ["Plano geral do terminal visto do campo.", "Rod caminhando na pista, o prédio enorme ao fundo.", "Close nas letras e nas janelas da fachada.", "Frame do filme (DISTRICT TWO) na frente do prédio real.", "Gente de patins e bicicleta pela pista."], "pergunta": "Você andaria numa pista de pouso de um aeroporto desativado?"}, {"a": "0:36", "b": "0:44", "t": "Velodrom", "chip": "Velodrom", "say": "Um ginásio de ciclismo de 1997 virou a sala onde os tributos esperam antes da arena.", "shot": "Fachada curva e o cartaz do Velodrom.", "txt": "LAUNCH ROOM", "mais": ["O Velodrom foi desenhado pelo francês Dominique Perrault e abriu em agosto de 1997.", "Fazia parte da candidatura de Berlim às Olimpíadas de 2000, que não deu certo.", "A pista é de madeira, de pinho siberiano, com 250 metros.", "O telhado tem 142 metros de diâmetro e cabem uns 12 mil lugares.", "Custou 270 milhões de marcos e recebe todo ano o Six Days of Berlin, ciclismo de pista.", "No filme, vira a Launch Room, onde os tributos são preparados antes de entrar na arena do 50º Hunger Games."], "planos": ["Parede curva de metal em plano aberto.", "Rod andando ao lado da fachada.", "Close na estrutura e nas rampas.", "Plano alto mostrando o formato redondo, se tiver ponto de vista."], "pergunta": "Você encararia uma pista de ciclismo inclinada?"}, {"a": "0:44", "b": "0:52", "t": "Tieranatomisches Theater", "chip": "Tieranatomisches", "say": "Projeto do mesmo arquiteto do Portão de Brandemburgo. Aqui o Snow tem aula.", "shot": "Pátio e fachada redonda. Um passo à frente da câmera.", "txt": "A SALA DE AULA", "mais": ["Esse prédio é de 1789–90, projeto do Langhans, o mesmo arquiteto do Portão de Brandemburgo, feito na mesma época.", "É o prédio acadêmico mais antigo ainda de pé em Berlim.", "Era o centro da antiga Escola de Veterinária do rei, com um auditório circular para uns 150 lugares.", "Lá dentro tem afrescos do Bernhard Rode.", "Hoje fica no Campus Nord da Universidade Humboldt e é usado em exposições.", "No filme, o auditório vira a sala de aula da Academia, onde o Coriolanus Snow assiste às aulas."], "planos": ["Plano aberto da fachada com a cúpula.", "Rod em primeiro plano, prédio redondo ao fundo.", "Close nas janelas arqueadas.", "Entrada do prédio, se estiver aberto."], "pergunta": "Você faria aula num lugar assim?"}, {"a": "0:52", "b": "1:04", "t": "Altes Museum", "chip": "Altes Museum", "say": "O Altes Museum é a Academia da Capital. Foi aqui que o Snow estudou.", "shot": "Rod subindo a escada, câmera no fundo da colunata.", "txt": "A ACADEMIA", "mais": ["Obra do Karl Friedrich Schinkel, construída entre 1823 e 1830.", "É considerado o primeiro museu público de Berlim.", "Por dentro, a rotunda é uma referência ao Panteão de Roma.", "Faz parte da Museumsinsel, Patrimônio da UNESCO desde 1999.", "Foi bombardeado na guerra e só reabriu em 1966.", "No filme é a Academia da Capital, com prédios altos colocados atrás por CGI."], "planos": ["Rod subindo a escada, câmera no fundo da colunata.", "Plano frontal da colunata.", "Gramado do Lustgarten com a fachada atrás.", "Frame do filme na mão, mesmo ângulo do gramado."], "pergunta": "Você sabia que esse prédio foi o primeiro museu público de Berlim?"}, {"a": "1:04", "b": "1:18", "t": "Strausberger Platz", "chip": "Strausberger", "say": "Fim na Karl-Marx-Allee: a estátua de espadas é CGI, mas a praça é de verdade.", "shot": "Rotatória com as duas torres, o Fernsehturm no fundo.", "txt": "FIM DA CAPITAL", "mais": ["Aqui é a Strausberger Platz, na Karl-Marx-Allee, avenida construída pela Alemanha Oriental entre 1952 e 1960.", "As duas torres foram projetadas por Hermann Henselmann, entre 1953 e 1956, com influência de Schinkel.", "A avenida se chamava Stalinallee, até ser renomeada em novembro de 1961.", "Foi nas obras da Stalinallee que operários começaram o protesto de 17 de junho de 1953.", "No filme, a estátua gigante de espadas cruzadas no centro da rotatória é CGI.", "Durante a gravação, espalharam neve artificial ao longo da Karl-Marx-Allee.", "Com sorte, o Fernsehturm aparece no fundo do plano."], "planos": ["Rotatória com as duas torres e a fonte.", "Rod atravessando a faixa de pedestre.", "Fernsehturm no fundo, plano aberto.", "Close em uma das torres, com os detalhes de pedra."], "pergunta": "Qual é o prédio mais 'bolo de casamento' que você já viu?"}, {"a": "1:18", "b": "1:30", "t": "Fecho", "chip": "Fecho", "say": "Salva esse roteiro e segue o próximo trecho no vlog completo.", "shot": "Rod olhando pra câmera.", "txt": "SALVA ESTE ROTEIRO", "mais": ["Foram 9 lugares, o dia inteiro de S-Bahn e bonde, e uma Capital inteira escondida no mapa de Berlim.", "Se você quer a lista com endereços e fatos, salva esse Reels.", "Qual foi a sua locação favorita? Comenta o número.", "No vlog completo eu mostro o que ficou de fora.", "Se você curte Hunger Games, marca alguém que precisa vir pra Berlim."], "planos": ["Rod no Strausberger, com a avenida atrás.", "Corte rápido de todos os lugares (montagem de 1 segundo cada).", "Rod apontando pra câmera no final."], "pergunta": "Qual foi a sua locação favorita? Comenta o número."}];
const EXTRAS={"ganchos": ["Hoje eu vou te mostrar a Capital de Hunger Games, só que ela fica em Berlim.", "Você sabia que a arena de Hunger Games é um estádio de verdade?", "9 lugares de Hunger Games que você pode ver de graça em Berlim.", "Eu fui atrás de todos os cenários de Hunger Games em Berlim, e olha o que eu achei.", "Se você já viu Hunger Games, você já viu Berlim sem saber."], "fechos": ["Qual foi a sua locação favorita? Comenta o número.", "Salva esse Reels e usa de guia na sua próxima viagem.", "Quer o roteiro completo? Me avisa nos comentários."], "legenda": "Roteiro Hunger Games em Berlim: 9 locações reais, do Olympiastadion à Strausberger Platz, tudo por fora e sem pagar ingresso. Salva pra sua próxima viagem. 🔥", "tags": "#HungerGames #Berlim #BerlinTravel #FilmLocations #TributosDePanem #BalladOfSongbirdsAndSnakes #Mockingjay #ViagemBerlim", "dicas": ["Mesmo ângulo, duas imagens: mostra 1–2 s do frame do filme e corta pro lugar real.", "Contador na tela: 1/9, 2/9… ajuda o espectador a acompanhar o roteiro.", "Fala rápida no começo de cada lugar (o nome), depois 1 fato e 1 curiosidade.", "Corte o que sobrar: o roteiro de 1:30 já está montado só com a coluna 'Fala principal'.", "Grave sempre 2 versões do fecho (pergunta e CTA) pra escolher na edição."]};
const DAYS=[{"n": 1, "titulo": "Dia 1: leste e centro", "dica": "Começa cedo na praça e termina às 14h na Tieranatomisches, que abre só à tarde.", "paradas": [{"nome": "Strausberger Platz", "hora": "9h", "local": "Strausberger Platz, 10243 Berlin", "nota": "Praça pública, de graça.", "route": "https://www.google.com/maps/dir/?api=1&origin=Berlin+Ostbahnhof&destination=Strausberger+Platz%2C+10243+Berlin&travelmode=transit", "frm": "Ostbahnhof"}, {"nome": "Velodrom", "hora": "10h", "local": "Velodrom Berlin, Paul-Heyse-Straße 26, Berlin", "nota": "Só a fachada, por fora.", "route": "https://www.google.com/maps/dir/?api=1&origin=Strausberger+Platz%2C+10243+Berlin&destination=Velodrom+Berlin%2C+Paul-Heyse-Stra%C3%9Fe+26%2C+Berlin&travelmode=transit", "frm": "Strausberger Platz"}, {"nome": "Altes Museum", "hora": "12h", "local": "Altes Museum, Am Lustgarten, 10178 Berlin", "nota": "Gramado do Lustgarten, de graça.", "route": "https://www.google.com/maps/dir/?api=1&origin=Velodrom+Berlin%2C+Paul-Heyse-Stra%C3%9Fe+26%2C+Berlin&destination=Altes+Museum%2C+Am+Lustgarten%2C+10178+Berlin&travelmode=transit", "frm": "Velodrom"}, {"nome": "Tieranatomisches Theater", "hora": "14h", "local": "Tieranatomisches Theater, Philippstraße 13, Berlin", "nota": "Abre às 14h. Confirme a exposição antes de ir.", "route": "https://www.google.com/maps/dir/?api=1&origin=Altes+Museum%2C+Am+Lustgarten%2C+10178+Berlin&destination=Tieranatomisches+Theater%2C+Philippstra%C3%9Fe+13%2C+Berlin&travelmode=transit", "frm": "Altes Museum"}]}, {"n": 2, "titulo": "Dia 2: oeste e sul", "dica": "Começa pelo Olympiastadion e termina no Tempelhof, o campo está aberto.", "paradas": [{"nome": "Olympiastadion", "hora": "9h", "local": "Olympiastadion Berlin, Olympischer Platz 3", "nota": "Exterior e praça, de graça.", "route": "https://www.google.com/maps/dir/?api=1&origin=Berlin+Ostbahnhof&destination=Olympiastadion+Berlin%2C+Olympischer+Platz+3&travelmode=transit", "frm": "Ostbahnhof"}, {"nome": "ICC Passerelle (passagem laranja)", "hora": "10h30", "local": "ICC Berlin, Messedamm 22, Berlin", "nota": "Passagem laranja sob o Messedamm. Confirme se está aberta.", "route": "https://www.google.com/maps/dir/?api=1&origin=Olympiastadion+Berlin%2C+Olympischer+Platz+3&destination=ICC+Berlin%2C+Messedamm+22%2C+Berlin&travelmode=transit", "frm": "Olympiastadion"}, {"nome": "Messe Berlin (Eingang Süd)", "hora": "11h30", "local": "Messe Berlin Eingang Süd, Jafféstraße, Berlin", "nota": "Fachada da entrada sul.", "route": "https://www.google.com/maps/dir/?api=1&origin=ICC+Berlin%2C+Messedamm+22%2C+Berlin&destination=Messe+Berlin+Eingang+S%C3%BCd%2C+Jaff%C3%A9stra%C3%9Fe%2C+Berlin&travelmode=transit", "frm": "ICC Passerelle (passagem laranja)"}, {"nome": "Flughafen Tempelhof", "hora": "14h", "local": "Flughafen Tempelhof, Platz der Luftbrücke 5, Berlin", "nota": "Campo e fachada, de graça.", "route": "https://www.google.com/maps/dir/?api=1&origin=Messe+Berlin+Eingang+S%C3%BCd%2C+Jaff%C3%A9stra%C3%9Fe%2C+Berlin&destination=Flughafen+Tempelhof%2C+Platz+der+Luftbr%C3%BCcke+5%2C+Berlin&travelmode=transit", "frm": "Messe Berlin (Eingang Süd)"}]}];
const app=document.getElementById('app');
let view='stops', cur=0, sc=0, sub='fotos', rcur=0, rsub='fala', esub='ganchos', dcur=0, pstep=0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const acc=(l,t,c)=>`<div class="acc"><span class="dot ${c}"></span><div><b>${l}</b> ${esc(t)}</div></div>`;
const ul=a=>`<ul class="facts">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;

function render(){
  const s=STOPS[cur];
  let h=`<div class="top"><div class="brand"><h1><span>Hunger Games</span> em Berlim</h1><p>${STOPS.length} locações a partir do Ostbahnhof · Rod</p></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="stops" aria-selected="${view==='stops'}">Locações</button>
    <button class="tab" role="tab" data-view="reels" aria-selected="${view==='reels'}">Roteiro do Reels</button>
    <button class="tab" role="tab" data-view="dias" aria-selected="${view==='dias'}">Plano de 2 dias</button>
  </div></div>`;
  if(view==='stops'){
    h+=`<nav class="pills" aria-label="Paradas">`+STOPS.map((x,i)=>`<button class="pill" data-stop="${i}" title="${esc(x.name)}" aria-current="${i===cur}">${x.n}</button>`).join('')+`</nav>`;
    const sceneN=s.scenes.length; if(sc>=sceneN) sc=0;
    h+=`<div class="stage" data-sub="${sub}">
      <div class="subtabs" role="tablist">
        <button data-sub="fotos" aria-selected="${sub==='fotos'}">Fotos</button>
        <button data-sub="cena" aria-selected="${sub==='cena'}">No filme</button>
        <button data-sub="acesso" aria-selected="${sub==='acesso'}">Acesso</button>
        <button data-sub="fatos" aria-selected="${sub==='fatos'}">Fatos</button>
      </div>
      <div class="photos">
        <figure class="fig"><span class="badge">Hoje</span><img alt="${esc(s.name)}" src="${s.real}"><figcaption class="cap">${esc(s.real_credit)}</figcaption></figure>
        <figure class="fig scene"><span class="badge">No filme</span>
          ${sceneN>1?`<div class="sw">`+s.scenes.map((_,k)=>`<button data-sc="${k}" aria-pressed="${k===sc}" aria-label="Cena ${k+1}">${k+1}</button>`).join('')+`</div>`:''}
          <img alt="Cena de Hunger Games em ${esc(s.name)}" src="${s.scenes[sc]}"><figcaption class="cap">${esc(s.scene_credit)}</figcaption></figure>
      </div>
      <div class="info">
        <div class="head"><div class="films">${esc(s.films)}</div><h2>${s.n}. ${esc(s.name)}</h2><div class="area">${esc(s.area)}</div></div>
        <div class="box" data-g="cena"><h3>O que foi gravado aqui</h3><p>${esc(s.scene_note)}</p></div>
        <div class="box acesso" data-g="acesso"><h3>Dá pra ver a locação?</h3>${acc('Entrar:',s.acesso.entra,s.acesso.entra_c)}${acc('Locação exata:',s.acesso.exata,s.acesso.exata_c)}</div>
        <div class="box" data-g="fatos"><h3>Fatos</h3>${ul(s.facts)}</div>
        <div class="box curio" data-g="cena"><h3>Curiosidade</h3><p>${esc(s.curio)}</p></div>
        <div class="actions">
          <a class="btn primary" href="${s.map}" target="_blank" rel="noopener">Abrir no mapa</a>
          <a class="btn" href="${s.route}" target="_blank" rel="noopener">Como chegar de ${esc(s.route_from)}</a>
          <span class="nav">
            <button class="btn" data-go="-1" ${cur===0?'disabled style="opacity:.4"':''} aria-label="Parada anterior">‹</button>
            <button class="btn" data-go="1" ${cur===STOPS.length-1?'disabled style="opacity:.4"':''} aria-label="Próxima parada">›</button>
          </span>
        </div>
      </div>
    </div>`;
  } else if(view==='dias'){
    h+=`<nav class="pills" aria-label="Dias">`+DAYS.map((d,i)=>`<button class="pill wide" data-dia="${i}" aria-current="${i===dcur}">Dia ${d.n}</button>`).join('')+`</nav>`;
    const d=DAYS[dcur];
    h+=`<div class="box"><h3>${esc(d.titulo)}</h3><p>${esc(d.dica)}</p></div>`;
    const mob=matchMedia('(max-width:760px)').matches;
    if(mob) h+=`<nav class="pills only-m" aria-label="Paradas do dia">`+d.paradas.map((p,i)=>`<button class="pill" data-pst="${i}" aria-current="${i===pstep}">${i+1}</button>`).join('')+`</nav>`;
    h+=`<div class="xgrid">`+d.paradas.map((p,i)=>(mob&&i!==pstep)?'':`<div class="box"><h3>${i+1}. ${esc(p.hora)} · ${esc(p.nome)}</h3><p>${esc(p.nota)}</p><p style="margin-top:8px"><a class="btn" href="${p.route}" target="_blank" rel="noopener">Como chegar de ${esc(p.frm)}</a></p></div>`).join('')+`</div>`;
    h+=`<p class="hint">Os horários são sugestões. Os trajetos abrem no Google Maps em transporte público.</p>`;
  } else {
    const ex=rcur===REELS.length;
    h+=`<nav class="pills hide-m" aria-label="Trechos do roteiro">`+REELS.map((r,i)=>`<button class="pill wide" data-r="${i}" aria-current="${i===rcur}">${esc(r.chip)}</button>`).join('')+`<button class="pill wide" data-r="${REELS.length}" aria-current="${ex}">Extras</button></nav>`;
    h+=`<select class="rsel only-m" aria-label="Trecho do roteiro">`+REELS.map((r,i)=>`<option value="${i}" ${i===rcur?'selected':''}>${i+1}. ${esc(r.t)} (${r.a})</option>`).join('')+`<option value="${REELS.length}" ${ex?'selected':''}>Extras</option></select>`;
    if(!ex){
      const r=REELS[rcur];
      h+=`<div class="rstage" data-rsub="${rsub}">
        <div class="subtabs" role="tablist">
          <button data-rsub="fala" aria-selected="${rsub==='fala'}">Fala</button>
          <button data-rsub="mais" aria-selected="${rsub==='mais'}">Mais falas</button>
          <button data-rsub="planos" aria-selected="${rsub==='planos'}">Planos</button>
        </div>
        <div class="rcol">
          <span class="time">${r.a}–${r.b}</span><h2>${esc(r.t)}</h2>
          <div class="box say" data-rg="fala"><h3>Fala principal (entra no 1:30)</h3><p>“${esc(r.say)}”</p></div>
          <div class="box tx" data-rg="fala"><h3>Texto na tela</h3><p>${esc(r.txt)}</p></div>
          <div class="box shot" data-rg="fala"><h3>Plano principal</h3><p>${esc(r.shot)}</p></div>
          <div class="box curio" data-rg="fala"><h3>Pergunta pro público</h3><p>${esc(r.pergunta)}</p></div>
        </div>
        <div class="rcol">
          <div class="box" data-rg="mais"><h3>Mais falas, você corta na edição</h3>${ul(r.mais)}</div>
          <div class="box" data-rg="planos"><h3>Planos extras pra gravar</h3>${ul(r.planos)}</div>
        </div>
      </div>
      <div class="rnav"><button class="btn" data-r="${rcur-1}" ${rcur===0?'disabled style="opacity:.4"':''}>‹ Anterior</button><span class="hint">${rcur+1} / ${REELS.length}</span><button class="btn" data-r="${rcur+1}">Próximo ›</button></div>`;
    } else {
      h+=`<div class="xwrap" data-esub="${esub}">
        <div class="subtabs" role="tablist">
          <button data-esub="ganchos" aria-selected="${esub==='ganchos'}">Ganchos</button>
          <button data-esub="fechos" aria-selected="${esub==='fechos'}">Fechos</button>
          <button data-esub="legenda" aria-selected="${esub==='legenda'}">Legenda</button>
          <button data-esub="dicas" aria-selected="${esub==='dicas'}">Dicas</button>
        </div>
        <div class="xgrid">
          <div class="box" data-e="ganchos"><h3>Ganchos alternativos (primeiros 3 s)</h3>${ul(EXTRAS.ganchos)}</div>
          <div class="box" data-e="fechos"><h3>Fechos alternativos</h3>${ul(EXTRAS.fechos)}</div>
          <div class="box" data-e="legenda"><h3>Legenda sugerida</h3><p>${esc(EXTRAS.legenda)}</p><p class="hint" style="margin-top:6px">${esc(EXTRAS.tags)}</p></div>
          <div class="box curio" data-e="dicas"><h3>Dicas de edição</h3>${ul(EXTRAS.dicas)}</div>
        </div>
      </div>`;
    }
  }
  h+=`<div class="foot">Fotos dos lugares: Wikimedia Commons (autoria e licença na legenda). Cenas: imagens de divulgação de Leonine Studios e Studiocanal, via Medienboard Berlin-Brandenburg.</div>`;
  app.innerHTML=h;
}
app.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t||t.disabled) return;
  if(t.dataset.view){view=t.dataset.view;render();}
  else if(t.dataset.stop!==undefined){cur=+t.dataset.stop;sc=0;render();}
  else if(t.dataset.sc!==undefined){sc=+t.dataset.sc;render();}
  else if(t.dataset.go){cur=Math.max(0,Math.min(STOPS.length-1,cur+ +t.dataset.go));sc=0;render();}
  else if(t.dataset.sub){sub=t.dataset.sub;render();}
  else if(t.dataset.rsub){rsub=t.dataset.rsub;render();}
  else if(t.dataset.esub){esub=t.dataset.esub;render();}
  else if(t.dataset.dia!==undefined){dcur=+t.dataset.dia;pstep=0;render();}
  else if(t.dataset.pst!==undefined){pstep=+t.dataset.pst;render();}
  else if(t.dataset.r!==undefined){rcur=Math.max(0,Math.min(REELS.length,+t.dataset.r));render();}
});
app.addEventListener('change',e=>{ if(e.target.classList.contains('rsel')){rcur=+e.target.value;render();} });
document.addEventListener('keydown',e=>{
  if(view!=='stops') return;
  if(e.key==='ArrowRight'&&cur<STOPS.length-1){cur++;sc=0;render();}
  if(e.key==='ArrowLeft'&&cur>0){cur--;sc=0;render();}
});
render();

</script>
</body>
